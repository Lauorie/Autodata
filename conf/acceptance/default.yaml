# Acceptance criteria, Fig 7 of arXiv 2606.25996 (Agentic Self-Instruct).
# All criteria must hold simultaneously for a QA pair to be ACCEPTED.

# Weak solver: should generally fail
weak_avg_max: 0.65        # mean rubric score over samples ≤ 0.65
weak_max_max: 0.75        # max single-sample score ≤ 0.75
no_zeros: true            # no weak sample may score 0

# Strong solver: should generally succeed but not be saturated
strong_avg_min: 0.60      # mean rubric score ≥ 0.60
strong_avg_max: 0.95      # mean rubric score < 0.95

# Gap: discriminative signal
gap_min: 0.20             # strong_avg - weak_avg ≥ 0.20
