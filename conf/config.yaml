defaults:
  - models: default
  - acceptance: default
  - _self_

run_id: ???
seed: 42
# Prompt directory for the challenger, verifier, solvers and judge. null is
# the seed CS set (src/autodata/llm/prompt_text/cs); a meta-optimization
# variant directory works too.
prompts_dir: null

paths:
  papers_dir: /root/autodl-fs/autodata/papers-mds
  outputs_root: /root/autodl-fs/autodata/outputs
  qwen_model_dir: /root/autodl-fs/autodata/Qwen3.5-4B

inner_loop:
  # The paper gives no budget: accepted items took 6.59 rounds on average,
  # with a tail past 10 (Sec 3.1.1). 15 covers that tail.
  max_iterations: 15
  num_solver_samples: 3
  # Fig 7: an infrastructure failure re-runs the eval of the same question.
  # After this many re-runs (or judge/verifier re-asks) the paper stops.
  infra_retries: 2

# One generation setting for both solvers, applied in code to weak and strong.
# GRPO rollouts and evaluation (step 6) must read these same values: the weak
# solver's budget decides which questions the loop accepts.
solver_generation:
  thinking: true            # Qwen3.5 thinks by default; the paper treats the 4B as a reasoning model
  max_tokens: 65536         # thinking + answer; paper App A reasoning budget for Qwen3.5-4B
  temperature: 1.0          # paper Sec 4: solvers run at temperature 1.0
  top_p: 0.95               # Qwen3.5 model card, thinking mode, general tasks
  top_k: 20
  presence_penalty: 1.5

# End-of-loop filter: Fig 9 check-3 rubric counts, then one more QV call.
final_filter:
  min_positive: 4
  min_negative: 3
  min_total: 10
  max_total: 20

run:
  papers_limit: null
  concurrency: 4
  paper_concurrency: 4     # how many papers to process in parallel

meta:
  n_generations: 4
  temperature: 0.1
  validation_papers: 8

train:
  # Defaults sized for 2× A800-80GB. Halve only if OOM.
  per_device_batch: 8
  num_generations: 4
  max_prompt_length: 4096
  max_completion_length: 384
  max_length: 4096       # SFT only
  max_steps: 30          # demo size; bump for a full run
  learning_rate: 1e-6
  grad_accum: 1
  save_steps: 30
  logging_steps: 2
  beta: 0.04
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

hydra:
  run:
    dir: ${paths.outputs_root}/${run_id}
  job:
    chdir: false
