# Model assignments. Every endpoint speaks the OpenAI Chat Completions API.
# `endpoint: proxy` -> wismodel proxy (OpenRouter). `endpoint: vllm` -> an
# OpenAI-compatible vLLM server (scripts/serve_weak_solver.sh). `endpoint:
# local_hf` -> in-process transformers, one sample at a time: smoke tests only.
#
# `thinking` switches the model's reasoning on or off. `max_tokens` caps
# thinking + answer together.
#
# Solvers: thinking, budget, and sampling come from `solver_generation` in
# conf/config.yaml, applied in code to both. Do not set them here.

challenger:
  endpoint: proxy
  model: moonshotai/kimi-k2.6
  temperature: 0.7
  max_tokens: 32768         # 4000 truncated 29 times with thinking on
  thinking: true
  reasoning_effort: auto

quality_verifier:
  endpoint: proxy
  model: moonshotai/kimi-k2.6
  temperature: 0.0
  max_tokens: 4096          # verdict JSON with per-check issues
  thinking: false           # Fig 9 is a fast verdict; the paper is silent

judge:
  endpoint: proxy
  model: moonshotai/kimi-k2.6
  temperature: 0.0
  max_tokens: 4096          # one score per rubric item plus feedback
  thinking: false

strong_solver:
  endpoint: proxy
  model: qwen/qwen3.5-397b-a17b
  reasoning_effort: auto    # thinking on, model default effort

weak_solver:
  endpoint: vllm
  model: qwen3.5-4b         # --served-model-name in scripts/serve_weak_solver.sh
  base_url_env: WEAK_SOLVER_BASE_URL
  api_key_env: WEAK_SOLVER_API_KEY

meta_optimizer:
  endpoint: proxy
  model: moonshotai/kimi-k2.6
  temperature: 0.4
  max_tokens: 12000
  thinking: true
  reasoning_effort: auto    # heavy reasoning for code edits
