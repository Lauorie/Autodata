[project]
name = "autodata"
version = "0.1.0"
description = "Reproduction of AutoData (Agentic Self-Instruct) from Meta FAIR RAM blog"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "openai>=1.50",
    "tenacity>=8",
    "pydantic>=2.6",
    "jsonschema>=4",
    "hydra-core>=1.3",
    "rich>=13",
    "tiktoken>=0.6",
    "pyyaml>=6",
    "tqdm>=4.66",
    "python-dotenv>=1",
]

[project.optional-dependencies]
serve = [
    "transformers",
    "accelerate",
    "vllm",
]
train = [
    "trl>=0.10",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodata"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
